<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戦士の陣取り</title>
<style>
  body{margin:0;background:#1b1b22;color:#eee;font-family:sans-serif;text-align:center}
  #hud{padding:8px;font-size:14px}
  #wrap{position:relative;display:inline-block;max-width:100%}
  canvas{max-width:100%;height:auto;touch-action:none;background:#000}
  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  button{font-size:20px;padding:10px 28px;border-radius:8px;border:0;background:#3b82f6;color:#fff;cursor:pointer}
</style></head>
<body>
<div id="hud"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <div id="msg" style="font-size:22px;line-height:1.6">戦士の陣取り<br><small>矢印キー / WASD / スワイプで移動。自陣から出て囲んで戻ると広がる。<br>自分の軌跡を敵に切られたら負け。敵の軌跡を断て!</small></div>
    <button id="start">スタート (Space)</button>
  </div>
</div>
<script src="src/config.js"></script>
<script src="src/mapdata.js"></script>
<script src="src/game.js"></script>
<script src="src/cpu.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body></html>
